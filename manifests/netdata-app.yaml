apiVersion: apps/v1
kind: Deployment
metadata:
  name: netdata-dep-al-25-03-2026
  namespace: dev-al-25-03-2026
spec:
  replicas: 3
  selector:
    matchLabels:
      app: netdata-al
  template:
    metadata:
      labels:
        app: netdata-al
    spec:
      containers:
      - name: netdata-container
        image: netdata/netdata:stable
        ports:
        - containerPort: 19999
---
apiVersion: v1
kind: Service
metadata:
  name: netdata-svc-al-25-03-2026
  namespace: dev-al-25-03-2026
spec:
  type: NodePort
  selector:
    app: netdata-al
  ports:
    - port: 19999
      targetPort: 19999
      nodePort: 30003