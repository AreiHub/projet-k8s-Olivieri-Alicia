apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-dep-al-25-03-2026
  namespace: dev-al-25-03-2026
spec:
  replicas: 3
  selector:
    matchLabels:
      app: caddy-al
  template:
    metadata:
      labels:
        app: caddy-al
    spec:
      containers:
      - name: caddy-container
        image: caddy:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: caddy-svc-al-25-03-2026
  namespace: dev-al-25-03-2026
spec:
  type: NodePort
  selector:
    app: caddy-al
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30002