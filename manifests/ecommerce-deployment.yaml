apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-dep-al-25-03-2026
  namespace: preprod-al-25-03-2026
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ecommerce-al
  template:
    metadata:
      labels:
        app: ecommerce-al
    spec:
      containers:
      - name: ecommerce-container
        image: mxkimv/ecommerce-al-25-03-2026:v1
        resources: 
          requests:
            cpu: "100m" 
            memory: "128Mi"
          limits:
            cpu: "500m" 
            memory: "256Mi"
        ports:
        - containerPort: 5005
        envFrom:
        - configMapRef:
            name: ecommerce-config-al-25-03-2026
        - secretRef:
            name: stripe-secret-al-25-03-2026
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-svc-al-25-03-2026
  namespace: preprod-al-25-03-2026
spec:
  type: NodePort
  selector:
    app: ecommerce-al
  ports:
    - port: 80
      targetPort: 5005
      nodePort: 30001